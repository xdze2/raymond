[project]
name = "data-atlas"
version = "0.1.0"
description = "Combinatorial wiki framework"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
