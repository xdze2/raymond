<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header id="axis-bar">
        <div id="wordmark">
          <!-- populated by JS -->
        </div>
        <table id="filter-table">
          <thead><!-- populated by JS --></thead>
          <tbody><!-- populated by JS --></tbody>
        </table>
      </header>

      <div id="main">
        <div id="grid-header">
          <span id="list-count"></span>
          <button id="toggle-pages" class="toggle-btn" title="Show only entries with a full page">pages only</button>
        </div>
        <div id="entry-grid">
          <!-- populated by JS -->
        </div>
      </div>

      <div id="modal" hidden>
        <div id="modal-backdrop"></div>
        <article id="modal-panel">
          <button id="modal-close" type="button" aria-label="Close">✕</button>
          <div id="view-content">
            <!-- populated by JS -->
          </div>
        </article>
      </div>
    </div>

    <script type="module">
      // ── tiny markdown renderer (no external deps) ────────────────────────────────

      function renderMarkdown(md) {
        // We'll use a simple sequential pass
        const lines = md.split("\n");
        let html = "";
        let i = 0;
        let inPara = false;
        let inList = false;

        const closePara = () => {
          if (inPara) {
            html += "</p>\n";
            inPara = false;
          }
        };
        const closeList = () => {
          if (inList) {
            html += "</ul>\n";
            inList = false;
          }
        };

        const inline = (text) => {
          // bold
          text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
          // italic
          text = text.replace(/\*(.+?)\*/g, "<em>$1</em>");
          // inline code
          text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
          // cross-links → [[slug]]
          text = text.replace(
            /→\s*\[\[([^\]]+)\]\]/g,
            (_, slug) =>
              `→ <a class="crosslink" href="#" data-slug="${slug}">${slug.replace(/-/g, " ")}</a>`,
          );
          // regular links
          text = text.replace(
            /\[([^\]]+)\]\(([^)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>',
          );
          return text;
        };

        while (i < lines.length) {
          const line = lines[i];

          // headings
          const hm = line.match(/^(#{1,6})\s+(.*)/);
          if (hm) {
            closePara();
            closeList();
            const level = hm[1].length;
            html += `<h${level}>${inline(hm[2])}</h${level}>\n`;
            i++;
            continue;
          }

          // horizontal rule
          if (/^---+$/.test(line.trim())) {
            closePara();
            closeList();
            html += "<hr>\n";
            i++;
            continue;
          }

          // unordered list
          const ulm = line.match(/^[-*]\s+(.*)/);
          if (ulm) {
            closePara();
            if (!inList) {
              html += "<ul>\n";
              inList = true;
            }
            html += `<li>${inline(ulm[1])}</li>\n`;
            i++;
            continue;
          }

          // blank line
          if (line.trim() === "") {
            closePara();
            closeList();
            i++;
            continue;
          }

          // paragraph
          closeList();
          if (!inPara) {
            html += "<p>";
            inPara = true;
          } else html += " ";
          html += inline(line.trim());
          i++;
        }
        closePara();
        closeList();
        return html;
      }

      // ── frontmatter parser ───────────────────────────────────────────────────────

      function parseFrontmatter(text) {
        const fm = {};
        let body = text;

        const match = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
        if (match) {
          const raw = match[1];
          body = match[2];
          for (const line of raw.split("\n")) {
            const kv = line.match(/^(\w+):\s*(.*)/);
            if (!kv) continue;
            const [, key, val] = kv;
            // array values like [a, b, c]
            if (val.startsWith("[")) {
              fm[key] = val
                .slice(1, -1)
                .split(",")
                .map((s) => s.trim().replace(/^"|"$/g, ""));
            } else {
              fm[key] = val.trim();
            }
          }
        }
        return { fm, body };
      }

      // ── state ────────────────────────────────────────────────────────────────────

      const state = {
        wiki: {}, // wiki.json config
        axes: [],
        filters: {}, // { axisId: Set<valueId> }
        entries: [], // all entries, merged from catalogue + pages
        activeSlug: null,
        pagesOnly: false,
      };

      // ── data loading ─────────────────────────────────────────────────────────────

      async function loadWiki() {
        const res = await fetch("../wiki.json");
        state.wiki = await res.json();
      }

      async function loadAxes() {
        const res = await fetch("../axis.json");
        const data = await res.json();
        state.axes = data.axes;
        state.axes.forEach((ax) => {
          state.filters[ax.id] = new Set();
        });
      }

      async function loadEntries() {
        // 1. fetch set of slugs that have a full page
        let pageSlugs = new Set();
        try {
          const res = await fetch("../pages/index.json");
          if (res.ok) pageSlugs = new Set(await res.json());
        } catch (_) {}

        // 2. fetch all catalogue JSONL files
        let catalogueFiles = [];
        try {
          const res = await fetch("../catalogue/index.json");
          if (res.ok) catalogueFiles = await res.json();
        } catch (_) {}

        const map = new Map(); // slug → entry, for deduplication

        await Promise.all(
          catalogueFiles.map(async (filename) => {
            try {
              const res = await fetch(`../catalogue/${filename}`);
              if (!res.ok) return;
              const text = await res.text();
              for (const line of text.split("\n")) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                try {
                  const entry = JSON.parse(trimmed);
                  if (!entry.slug) continue;
                  // page entry wins over catalogue seed if already present
                  if (!map.has(entry.slug)) {
                    map.set(entry.slug, {
                      ...entry,
                      page_url: pageSlugs.has(entry.slug)
                        ? `../pages/${entry.slug}.md`
                        : null,
                    });
                  }
                } catch (_) {}
              }
            } catch (_) {}
          }),
        );

        // 3. load full page entries — they override catalogue seeds
        await Promise.all(
          [...pageSlugs].map(async (slug) => {
            try {
              const res = await fetch(`../pages/${slug}.md`);
              if (!res.ok) return;
              const text = await res.text();
              const { fm } = parseFrontmatter(text);
              const entry = {
                slug: fm.slug || slug,
                title: fm.title || slug,
                summary: fm.summary || "",
                page_url: `../pages/${slug}.md`,
                _raw: text,
              };
              // copy all known axis values from frontmatter
              for (const ax of state.axes) {
                entry[ax.id] = fm[ax.id] || null;
              }
              // copy extra-chip fields declared in wiki.json
              for (const chip of state.wiki.extra_chips || []) {
                entry[chip.field] = fm[chip.field] ?? (chip.array ? [] : null);
              }
              map.set(slug, entry);
            } catch (_) {}
          }),
        );

        state.entries = [...map.values()].sort((a, b) =>
          a.title.localeCompare(b.title),
        );
      }

      async function loadEnrichments() {
        // best-effort: fetch all enrichment sidecars in parallel so cards can show thumbnails
        await Promise.all(
          state.entries.map(async (entry) => {
            try {
              const res = await fetch(`../enrichments/${entry.slug}.json`);
              if (!res.ok) return;
              entry._enrichment = await res.json();
            } catch (_) {}
          }),
        );
      }

      // ── rendering ────────────────────────────────────────────────────────────────

      function getStatusColor(statusId) {
        const statusAxisId = state.wiki.status_axis;
        if (!statusAxisId) return "#aaa";
        for (const ax of state.axes) {
          if (ax.id === statusAxisId) {
            const v = ax.values.find((v) => v.id === statusId);
            if (v && v.color) return v.color;
          }
        }
        return "#aaa";
      }

      function renderWordmark() {
        const el = document.getElementById("wordmark");
        el.innerHTML = "";
        for (const word of state.wiki.wordmark || []) {
          const span = document.createElement("span");
          span.textContent = word;
          el.appendChild(span);
        }
      }

      function setDocumentTitle() {
        document.title = state.wiki.title || "Wiki";
      }

      function renderExtraChips(source) {
        return (state.wiki.extra_chips || [])
          .map((chip) => {
            const val = source[chip.field];
            if (chip.array) {
              const arr = Array.isArray(val) ? val : [];
              const cls = chip.class || "chip-extra";
              return arr
                .map((v) => `<span class="chip ${cls}">${v}</span>`)
                .join("");
            }
            if (!val) return "";
            const cls = chip.class || "chip-extra";
            const label = chip.label ? `${chip.label}: ` : "";
            return `<span class="chip ${cls}">${label}${val}</span>`;
          })
          .join("");
      }

      function renderAxisBar() {
        const table = document.getElementById("filter-table");
        const thead = table.querySelector("thead");
        const tbody = table.querySelector("tbody");
        thead.innerHTML = "";
        tbody.innerHTML = "";

        const headRow = document.createElement("tr");
        for (const axis of state.axes) {
          const th = document.createElement("th");
          const selected = state.filters[axis.id];
          th.className = "filter-th";
          if (selected.size) th.classList.add("has-selection");
          th.title = axis.description || "";

          const label = document.createElement("span");
          label.className = "filter-th-label";
          label.textContent = axis.label;
          th.appendChild(label);

          if (selected.size) {
            const clear = document.createElement("button");
            clear.type = "button";
            clear.className = "filter-th-clear";
            clear.textContent = "×";
            clear.title = "Clear";
            clear.addEventListener("click", (e) => {
              e.stopPropagation();
              selected.clear();
              renderAxisBar();
              renderList();
            });
            th.appendChild(clear);
          }
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);

        const maxRows = Math.max(...state.axes.map((a) => a.values.length));
        for (let r = 0; r < maxRows; r++) {
          const tr = document.createElement("tr");
          for (const axis of state.axes) {
            const td = document.createElement("td");
            const val = axis.values[r];
            if (!val) {
              td.className = "filter-cell filter-cell-empty";
              tr.appendChild(td);
              continue;
            }
            const selected = state.filters[axis.id];
            const isSel = selected.has(val.id);

            td.className = "filter-cell";
            if (isSel) td.classList.add("selected");
            if (axis.id === "status" && val.color) {
              td.style.setProperty("--status-color", val.color);
              if (isSel) td.classList.add("status-colored");
            }
            td.title = val.description || val.label;
            td.textContent = val.label;

            td.addEventListener("click", () => {
              if (isSel) selected.delete(val.id);
              else selected.add(val.id);
              renderAxisBar();
              renderList();
            });
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
      }

      function filteredEntries() {
        return state.entries.filter((entry) => {
          if (state.pagesOnly && !entry.page_url) return false;
          for (const axisId of Object.keys(state.filters)) {
            const selected = state.filters[axisId];
            if (!selected.size) continue;
            if (!selected.has(entry[axisId])) return false;
          }
          return true;
        });
      }

      function renderList() {
        const grid = document.getElementById("entry-grid");
        const countEl = document.getElementById("list-count");
        grid.innerHTML = "";

        const entries = filteredEntries();
        const total = state.entries.length;
        const filtered = entries.length;
        countEl.textContent = filtered === total
          ? `${total} datasets`
          : `${filtered} / ${total} datasets`;

        for (const entry of entries) {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "entry-card";
          if (!entry.page_url) card.classList.add("stub");

          const thumb = document.createElement("div");
          thumb.className = "card-thumb";
          const imgPath = entry._enrichment?.image?.web_path;
          if (imgPath) {
            const img = document.createElement("img");
            img.loading = "lazy";
            img.src = `../../../${imgPath}`;
            img.alt = entry.title;
            thumb.appendChild(img);
          } else {
            thumb.classList.add("placeholder");
            const initial = document.createElement("span");
            initial.className = "card-thumb-initial";
            initial.textContent = (entry.title || "?").charAt(0).toUpperCase();
            thumb.appendChild(initial);
          }

          if (entry.status) {
            const dot = document.createElement("span");
            dot.className = "status-dot card-status-dot";
            dot.style.background = getStatusColor(entry.status);
            dot.title = entry.status;
            thumb.appendChild(dot);
          }

          const body = document.createElement("div");
          body.className = "card-body";

          const titleEl = document.createElement("div");
          titleEl.className = "card-title";
          titleEl.textContent = entry.title;
          body.appendChild(titleEl);

          if (entry.summary) {
            const summaryEl = document.createElement("div");
            summaryEl.className = "card-summary";
            summaryEl.textContent = entry.summary;
            body.appendChild(summaryEl);
          }

          card.appendChild(thumb);
          card.appendChild(body);
          card.addEventListener("click", () => loadEntry(entry.slug));
          grid.appendChild(card);
        }
      }

      function selectSimilar(source) {
        let any = false;
        for (const ax of state.axes) {
          const set = state.filters[ax.id];
          set.clear();
          const val = source[ax.id];
          if (val) {
            set.add(val);
            any = true;
          }
        }
        if (!any) return;
        renderAxisBar();
        renderList();
      }

      function openModal() {
        document.getElementById("modal").hidden = false;
        document.body.classList.add("modal-open");
      }

      function closeModal() {
        document.getElementById("modal").hidden = true;
        document.body.classList.remove("modal-open");
        state.activeSlug = null;
      }

      async function loadEntry(slug) {
        state.activeSlug = slug;

        const entry = state.entries.find((e) => e.slug === slug);
        if (!entry) return;

        const viewEl = document.getElementById("view-content");
        viewEl.innerHTML = '<div class="loading">Loading…</div>';
        openModal();

        // catalogue-only entry: no page yet
        if (!entry._raw && !entry.page_url) {
          const axisChips = state.axes
            .map((ax) => {
              const val = entry[ax.id];
              if (!val) return "";
              const color = ax.id === "status" ? getStatusColor(val) : null;
              const style = color
                ? ` style="border-color:${color};color:${color}"`
                : "";
              return `<span class="chip"${style}>${ax.label}: ${val}</span>`;
            })
            .join("");

          viewEl.innerHTML = `
      <div class="entry-header">
        <h1 class="entry-title-large">${entry.title}</h1>
        <p class="entry-summary">${entry.summary}</p>
        <div class="chips">${axisChips}<button class="select-similar" type="button">select similar</button></div>
      </div>
      <div class="entry-body entry-stub"><p>No page written yet.</p></div>
    `;
          viewEl
            .querySelector(".select-similar")
            ?.addEventListener("click", () => selectSimilar(entry));
          return;
        }

        // load raw text if not already in memory (page_url set but _raw missing)
        let raw = entry._raw;
        if (!raw && entry.page_url) {
          const res = await fetch(entry.page_url);
          raw = await res.text();
          entry._raw = raw;
        }

        const { fm, body } = parseFrontmatter(raw);

        const axisChips = state.axes
          .map((ax) => {
            const val = fm[ax.id];
            if (!val) return "";
            const color = ax.id === "status" ? getStatusColor(val) : null;
            const style = color
              ? ` style="border-color:${color};color:${color}"`
              : "";
            return `<span class="chip"${style}>${ax.label}: ${val}</span>`;
          })
          .join("");

        const extraChips = renderExtraChips(fm);

        const enrichment = entry._enrichment || null;

        let infobox = "";
        if (enrichment && enrichment.image && enrichment.image.web_path) {
          const img = enrichment.image;
          const src = `../../../${img.web_path}`;
          const lic = img.license_short
            ? `<a href="${img.license_url}" target="_blank" rel="noopener">${img.license_short}</a>`
            : "";
          const artist = img.artist
            ? img.artist.replace(/<[^>]+>/g, "") // strip Commons HTML
            : "";
          const credit = [artist, lic].filter(Boolean).join(" — ");
          infobox = `
            <aside class="infobox">
              <img src="${src}" alt="${fm.title || slug}" />
              ${credit ? `<div class="infobox-credit">${credit}</div>` : ""}
            </aside>
          `;
        }

        const html = `
    <div class="entry-header">
      <h1 class="entry-title-large">${fm.title || slug}</h1>
      <p class="entry-summary">${fm.summary || ""}</p>
      <div class="chips">${axisChips}${extraChips}<button class="select-similar" type="button">select similar</button></div>
    </div>
    <div class="entry-body">${infobox}${renderMarkdown(body)}</div>
  `;

        viewEl.innerHTML = html;

        viewEl
          .querySelector(".select-similar")
          ?.addEventListener("click", () => selectSimilar(fm));

        viewEl.querySelectorAll("a.crosslink").forEach((a) => {
          a.addEventListener("click", (e) => {
            e.preventDefault();
            const target = a.dataset.slug;
            const found = state.entries.find((e) => e.slug === target);
            if (found) loadEntry(target);
            else {
              viewEl.innerHTML += `<p class="crosslink-missing">Entry "${target}" not yet in the atlas.</p>`;
            }
          });
        });
      }

      // ── init ─────────────────────────────────────────────────────────────────────

      async function init() {
        await loadWiki();
        await loadAxes();
        renderWordmark();
        setDocumentTitle();
        await loadEntries();
        await loadEnrichments();
        renderAxisBar();
        renderList();

        document.getElementById("toggle-pages").addEventListener("click", (e) => {
          state.pagesOnly = !state.pagesOnly;
          e.currentTarget.classList.toggle("active", state.pagesOnly);
          renderList();
        });

        document.getElementById("modal-close").addEventListener("click", closeModal);
        document.getElementById("modal-backdrop").addEventListener("click", closeModal);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !document.getElementById("modal").hidden) {
            closeModal();
          }
        });

      }

      init().catch(console.error);
    </script>
  </body>
</html>
